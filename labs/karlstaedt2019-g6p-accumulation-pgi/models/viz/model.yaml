schema_version: '2.0'
title: Karlstaedt2019 G6p Accumulation Pgi Visualization
description: "Dedicated visualization sub-model for Karlstaedt2019 G6p Accumulation\
  \ Pgi. Consumes the core SBML simulator's state stream, accumulates a per-window\
  \ history, and emits a friendly timeseries plot plus a plain-language Q&A summary.\
  \ No SBML, no roadrunner, no domain biology \u2014 pure data-to-presentation."
standard: other
tags:
- cardiovascular
- sbml
- biomodels_ebi
- faithful
- visualization
authors:
- Biosimulant Team
biosim:
  entrypoint: src.karlstaedt2019_g6p_accumulation_pgi_viz:Karlstaedt2019G6pAccumulationViaPhosphoglucoModel1910170001ModelViz
  init_kwargs:
    integration_step: 1.0
    lab_title: Karlstaedt2019 G6p Accumulation Pgi
    lab_question: Does phosphoglucose isomerase inhibition accumulate glucose-6-phosphate?
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages: []
parameters:
- name: integration_step
  value: 1.0
  min: 0.0
  units: s
  description: BioWorld pacing step for the viz sub-model.
- name: lab_title
  value: Karlstaedt2019 G6p Accumulation Pgi
  description: Human-friendly title used in the Q&A subtitle.
- name: lab_question
  value: Does phosphoglucose isomerase inhibition accumulate glucose-6-phosphate?
  description: Lab-specific framing question used as visualization title and subtitle
    prefix. Empty -> generic title.
io:
  inputs:
  - name: state
    description: Per-window species/state-variable record from the core SBML model.
  - name: species_labels
    description: 'Static {species_id: human_label} record from the core SBML model.
      Used once to decorate the timeseries.'
  - name: scenario_metadata
    description: Scenario timing, active challenge, and plain-language metadata from
      the scenario driver.
  outputs:
  - name: run_summary
    description: Structured Q&A record echoing the rows in the 'What Happened' table
      (question/answer pairs plus duration, point count, peak species). Downstream
      nodes can consume it; if unwired, the table still renders.
