schema_version: '1.0'
title: Guyton1972 Muscle Blood Flow Scenario
description: Scenario driver that emits baseline, challenge, and recovery inputs for
  the cardiovascular core model.
package: cardiovascular-scenario-guyton1972-muscle-blood-flow
version: 0.1.0
standard: biosim-module
tags:
- cardiovascular
- scenario
- stimulus
authors:
- name: Biosimulant Team
biosim:
  entrypoint: src.guyton1972_muscle_blood_flow_scenario.CardiovascularScenarioModel
runtime:
  dependencies:
    packages: []
parameters:
- name: scenario_name
  value: Oxygen availability challenge
  description: Plain-language name shown in visualizations.
- name: scenario_description
  value: Baseline is followed by a muscle oxygen challenge and recovery period.
  description: Plain-language scenario description shown in visualizations.
- name: baseline_until
  value: 150.0
  units: s
  min: 0.0
  description: Simulation time at which the challenge starts.
- name: challenge_until
  value: 450.0
  units: s
  min: 0.0
  description: Simulation time at which recovery starts.
- name: schedule
  value:
    muscle_oxygen:
      baseline: 38.0666
      challenge: 19.0333
      recovery: 38.0666
      unit: dimensionless
      label: muscle oxygen
      description: Scenario-controlled muscle oxygen value.
      active: true
  description: Per-output baseline, challenge, and recovery values emitted by the
    scenario driver.
io:
  inputs: []
  outputs:
  - name: muscle_oxygen
    emitted_unit: dimensionless
    description: Scenario-controlled muscle oxygen value.
  - name: scenario_metadata
    description: Scenario name, active input, values, timing, and event markers.
