schema_version: '1.0'
title: Guyton1972 Heart Hypertrophy Scenario
description: Scenario driver that emits baseline, challenge, and recovery inputs for
  the cardiovascular core model.
package: cardiovascular-scenario-guyton1972-heart-hypertrophy
version: 0.1.0
standard: other
tags:
- cardiovascular
- scenario
- stimulus
authors:
- name: Biosimulant Team
biosim:
  entrypoint: src.guyton1972_heart_hypertrophy_scenario.CardiovascularScenarioModel
  communication_step: 1.0
runtime:
  dependencies:
    packages: []
parameters:
- name: scenario_name
  value: Pressure-load challenge
  description: Plain-language name shown in visualizations.
- name: scenario_description
  value: Baseline is followed by a arterial pressure challenge and recovery period.
  description: Plain-language scenario description shown in visualizations.
- name: baseline_until
  value: 150.0
  units: s
  min: 0.0
  description: Simulation time at which the challenge starts.
- name: challenge_until
  value: 450.0
  units: s
  min: 0.0
  description: Simulation time at which recovery starts.
- name: schedule
  value:
    aortic_flow:
      baseline: 5.00707
      challenge: 5.00707
      recovery: 5.00707
      unit: dimensionless
      label: aortic flow
      description: Scenario-controlled aortic flow value.
      active: false
    arterial_pressure:
      baseline: 103.525
      challenge: 124.23
      recovery: 103.525
      unit: dimensionless
      label: arterial pressure
      description: Scenario-controlled arterial pressure value.
      active: true
    pulmonary_artery_pressure:
      baseline: 15.6376
      challenge: 15.6376
      recovery: 15.6376
      unit: dimensionless
      label: pulmonary artery pressure
      description: Scenario-controlled pulmonary artery pressure value.
      active: false
  description: Per-output baseline, challenge, and recovery values emitted by the
    scenario driver.
io:
  inputs: []
  outputs:
  - name: aortic_flow
    emitted_unit: dimensionless
    description: Scenario-controlled aortic flow value.
  - name: arterial_pressure
    emitted_unit: dimensionless
    description: Scenario-controlled arterial pressure value.
  - name: pulmonary_artery_pressure
    emitted_unit: dimensionless
    description: Scenario-controlled pulmonary artery pressure value.
  - name: scenario_metadata
    description: Scenario name, active input, values, timing, and event markers.
