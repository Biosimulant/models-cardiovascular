description: 'Two-model lab for Guyton1972 Capillary Dynamics: a core SBML simulator wired into a dedicated visualization sub-model that turns the raw state into friendly timeseries and a plain-language summary. This a model from the article: Circulation: overall regulation. It can be used to explore cardiac dynamics and compare response patterns across conditions.'
io:
  inputs:
  - maps_to: guyton1972_capillary_dynamics_core.integration_step
    name: integration_step
  - maps_to: guyton1972_capillary_dynamics_core.parameter_overrides
    name: parameter_overrides
  - maps_to: guyton1972_capillary_dynamics_core.initial_conditions
    name: initial_conditions
  outputs:
  - maps_to: guyton1972_capillary_dynamics_scenario.scenario_metadata
    name: scenario_metadata
  - maps_to: guyton1972_capillary_dynamics_core.state
    name: state
  - maps_to: guyton1972_capillary_dynamics_viz.run_summary
    name: run_summary
models:
- alias: guyton1972_capillary_dynamics_scenario
  parameters:
    baseline_until: 150
    challenge_until: 450
    scenario_description: Baseline is followed by a capillary pressure challenge and recovery period.
    scenario_name: Pressure-load challenge
    schedule:
      capillary_pressure:
        active: true
        baseline: 16.9144
        challenge: 20.29728
        description: Scenario-controlled capillary pressure value.
        label: capillary pressure
        recovery: 16.9144
        unit: dimensionless
      filtration_coefficient:
        active: false
        baseline: -4.078e-7
        challenge: -4.078e-7
        description: Scenario-controlled filtration coefficient value.
        label: filtration coefficient
        recovery: -4.078e-7
        unit: dimensionless
  path: models/scenario
- alias: guyton1972_capillary_dynamics_core
  parameters:
    integration_step: 1
    model_path: data/MODEL0912160000.xml
  path: models/core
- alias: guyton1972_capillary_dynamics_viz
  parameters:
    integration_step: 1
    lab_question: Does fluid move into or out of the capillaries?
    lab_title: Guyton1972 Capillary Dynamics
  path: models/viz
runtime:
  communication_step: 1
  duration: 600
  initial_inputs:
    guyton1972_capillary_dynamics_core:
      initial_conditions:
        payload: {}
      integration_step: 1
      parameter_overrides:
        payload: {}
schema_version: '2.0'
package: guyton1972-capillary-dynamics
version: 1.0.0
title: Guyton1972 Capillary Dynamics Lab
wiring:
- from: guyton1972_capillary_dynamics_scenario.capillary_pressure
  to:
  - guyton1972_capillary_dynamics_core.capillary_pressure
- from: guyton1972_capillary_dynamics_scenario.filtration_coefficient
  to:
  - guyton1972_capillary_dynamics_core.filtration_coefficient
- from: guyton1972_capillary_dynamics_scenario.scenario_metadata
  to:
  - guyton1972_capillary_dynamics_viz.scenario_metadata
- from: guyton1972_capillary_dynamics_core.state
  to:
  - guyton1972_capillary_dynamics_viz.state
- from: guyton1972_capillary_dynamics_core.species_labels
  to:
  - guyton1972_capillary_dynamics_viz.species_labels
