schema_version: '2.0'
title: Chen2007 Neuronal Endothelial Nos Visualization
description: "Dedicated visualization sub-model for Chen2007 Neuronal Endothelial\
  \ Nos. Consumes the core SBML simulator's state stream, accumulates a per-window\
  \ history, and emits a friendly timeseries plot plus a plain-language Q&A summary.\
  \ No SBML, no roadrunner, no domain biology \u2014 pure data-to-presentation."
standard: other
tags:
- cardiovascular
- sbml
- biomodels_ebi
- faithful
- visualization
authors:
- Biosimulant Team
biosim:
  entrypoint: src.chen2007_neuronal_endothelial_nos_viz:Chen2007NeuronalendothelialnosModel0491251823ModelViz
  init_kwargs:
    integration_step: 0.001
    lab_title: Chen2007 Neuronal Endothelial Nos
    lab_question: How do nitric oxide synthase pathways shape nitric oxide availability?
  communication_step: 0.001
runtime:
  python_version: '3.12'
  dependencies:
    packages: []
parameters:
- name: integration_step
  value: 0.001
  min: 0.0
  units: s
  description: BioWorld pacing step for the viz sub-model.
- name: lab_title
  value: Chen2007 Neuronal Endothelial Nos
  description: Human-friendly title used in the Q&A subtitle.
- name: lab_question
  value: How do nitric oxide synthase pathways shape nitric oxide availability?
  description: Lab-specific framing question used as visualization title and subtitle
    prefix. Empty -> generic title.
io:
  inputs:
  - name: state
    description: Per-window species/state-variable record from the core SBML model.
  - name: species_labels
    description: 'Static {species_id: human_label} record from the core SBML model.
      Used once to decorate the timeseries.'
  - name: scenario_metadata
    description: Scenario timing, active challenge, and plain-language metadata from
      the scenario driver.
  outputs:
  - name: run_summary
    description: Structured Q&A record echoing the rows in the 'What Happened' table
      (question/answer pairs plus duration, point count, peak species). Downstream
      nodes can consume it; if unwired, the table still renders.
