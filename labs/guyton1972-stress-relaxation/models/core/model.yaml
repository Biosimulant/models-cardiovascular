schema_version: '2.0'
title: Guyton1972_StressRelaxation
description: 'This a model from the article: Circulation: overall regulation. It can
  be used to explore cardiac dynamics and compare response patterns across conditions.'
standard: other
tags:
- cardiovascular
- sbml
- biomodels_ebi
- faithful
authors:
- Biosimulant Team
- A C Guyton
- T G Coleman
- H J Granger
upstream:
  id: biomodels_ebi:MODEL0910896131
  source_db: biomodels_ebi
  source_id: MODEL0910896131
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL0910896131
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL0910896131?filename=MODEL0910896131_url.xml
  license: CC0
biosim:
  entrypoint: src.guyton1972_stressrelaxation_model0910896131_model:Guyton1972StressrelaxationModel0910896131Model
  init_kwargs:
    model_path: data/MODEL0910896131.xml
    integration_step: 0.001
  communication_step: 0.001
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
parameters:
- name: model_path
  value: data/MODEL0910896131.xml
  description: Relative path to the SBML file shipped with this model.
- name: integration_step
  value: 0.001
  min: 0.0
  units: s
  description: ODE solver integration step size in seconds.
io:
  inputs:
  - name: effective_volume
    accepted_units:
    - dimensionless
    description: Sets effective volume for the simulation scenario. Default `0.743224`.
  - name: stress_relaxation_gain
    accepted_units:
    - dimensionless
    description: Sets stress relaxation gain for the simulation scenario. Default
      `5.0`.
  - name: stress_relaxation_gain_2
    accepted_units:
    - dimensionless
    description: Sets stress relaxation gain 2 for the simulation scenario. Default
      `10000.0`.
  - name: integration_step
    accepted_units:
    - s
    description: Override the ODE solver integration step. Smaller = more precise
      but slower.
  - name: parameter_overrides
    description: Map of SBML global parameter name to override value, applied before
      each advance_window. Use the parameter list in the lab README for keys not surfaced
      as named ports above.
  - name: initial_conditions
    description: Map of SBML species ID to initial concentration override, applied
      at setup and on reset. Use the species list in the lab README to discover keys.
  outputs:
  - name: state
    description: Species concentrations and state variables read from the SBML model.
      Wired into the lab's `viz` sub-model for timeseries rendering.
  - name: summary
    description: Final, peak, and largest-change summary computed from the simulated SBML state history.
  - name: species_labels
    description: Static record mapping each SBML species id to a human-friendly label
      (read from `<species name=...>` or prettified id). Emitted on every window but
      only needed once by downstream presenters.
