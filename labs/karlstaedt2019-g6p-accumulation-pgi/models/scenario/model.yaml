schema_version: '1.0'
title: Karlstaedt2019 G6p Accumulation Pgi Scenario
description: Scenario driver that emits baseline, challenge, and recovery inputs for
  the cardiovascular core model.
package: cardiovascular-scenario-karlstaedt2019-g6p-accumulation-pgi
version: 0.1.0
standard: biosim-module
tags:
- cardiovascular
- scenario
- stimulus
authors:
- name: Biosimulant Team
biosim:
  entrypoint: src.karlstaedt2019_g6p_accumulation_pgi_scenario.CardiovascularScenarioModel
runtime:
  dependencies:
    packages: []
parameters:
- name: scenario_name
  value: Metabolic capacity challenge
  description: Plain-language name shown in visualizations.
- name: scenario_description
  value: Baseline is followed by a extracellular glucose challenge and recovery period.
  description: Plain-language scenario description shown in visualizations.
- name: baseline_until
  value: 150.0
  units: s
  min: 0.0
  description: Simulation time at which the challenge starts.
- name: challenge_until
  value: 450.0
  units: s
  min: 0.0
  description: Simulation time at which recovery starts.
- name: schedule
  value:
    extracellular_glucose:
      baseline: 5.5
      challenge: 8.25
      recovery: 5.5
      unit: dimensionless
      label: extracellular glucose
      description: Scenario-controlled extracellular glucose value.
      active: true
    cellular_energy_pool:
      baseline: 3.0417
      challenge: 3.0417
      recovery: 3.0417
      unit: dimensionless
      label: cellular energy pool
      description: Scenario-controlled cellular energy pool value.
      active: false
  description: Per-output baseline, challenge, and recovery values emitted by the
    scenario driver.
io:
  inputs: []
  outputs:
  - name: extracellular_glucose
    emitted_unit: dimensionless
    description: Scenario-controlled extracellular glucose value.
  - name: cellular_energy_pool
    emitted_unit: dimensionless
    description: Scenario-controlled cellular energy pool value.
  - name: scenario_metadata
    description: Scenario name, active input, values, timing, and event markers.
