schema_version: '2.0'
title: Karlstaedt2019 - G6P accumulation via Phosphoglucose isomerase inhibition in
  heart muscles
description: 'This model is described in the article: Glucose 6-phosphate accumulates
  via phosphoglucose isomerase inhibition in heart muscle. Karlstaedt, A and Khanna,
  R and Thangam, M and Taegtmeyer, H Circulatio.'
standard: other
tags:
- cardiovascular
- sbml
- biomodels_ebi
- faithful
authors:
- Biosimulant Team
- Anja Karlstaedt
- Radhika Khanna
- Manoj Thangam
- Heinrich Taegtmeyer
upstream:
  id: biomodels_ebi:MODEL1910170001
  source_db: biomodels_ebi
  source_id: MODEL1910170001
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL1910170001
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL1910170001?filename=CardioGlyco-v1.xml
  license: CC0
biosim:
  entrypoint: src.karlstaedt2019_g6p_accumulation_via_phosphogluco_model1910170001_model:Karlstaedt2019G6pAccumulationViaPhosphoglucoModel1910170001Model
  init_kwargs:
    model_path: data/MODEL1910170001.xml
    integration_step: 1.0
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
parameters:
- name: model_path
  value: data/MODEL1910170001.xml
  description: Relative path to the SBML file shipped with this model.
- name: integration_step
  value: 1.0
  min: 0.0
  units: s
  description: ODE solver integration step size in seconds.
io:
  inputs:
  - name: extracellular_glucose
    accepted_units:
    - dimensionless
    description: Sets extracellular glucose for the simulation scenario. Default `5.5`.
  - name: cellular_energy_pool
    accepted_units:
    - dimensionless
    description: Sets cellular energy pool for the simulation scenario. Default `3.0417`.
  - name: integration_step
    accepted_units:
    - s
    description: Override the ODE solver integration step. Smaller = more precise
      but slower.
  - name: parameter_overrides
    description: Map of SBML global parameter name to override value, applied before
      each advance_window. Use the parameter list in the lab README for keys not surfaced
      as named ports above.
  - name: initial_conditions
    description: Map of SBML species ID to initial concentration override, applied
      at setup and on reset. Use the species list in the lab README to discover keys.
  outputs:
  - name: state
    description: Species concentrations and state variables read from the SBML model.
      Wired into the lab's `viz` sub-model for timeseries rendering.
  - name: species_labels
    description: Static record mapping each SBML species id to a human-friendly label
      (read from `<species name=...>` or prettified id). Emitted on every window but
      only needed once by downstream presenters.
