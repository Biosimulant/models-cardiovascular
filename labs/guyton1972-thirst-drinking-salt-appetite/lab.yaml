schema_version: '2.0'
package: guyton1972-thirst-drinking-salt-appetite
version: 1.0.0
title: Guyton1972 Thirst Drinking Salt Appetite Lab
description: 'Two-model lab for Guyton1972 Thirst Drinking Salt Appetite: a core SBML
  simulator wired into a dedicated visualization sub-model that turns the raw state
  into friendly timeseries and a plain-language summary. This a model from the article:
  Circulation: overall regulation. It can be used to explore cardiac dynamics and
  compare response patterns across conditions.'
models:
- alias: guyton1972_thirst_drinking_salt_appetite_scenario
  path: models/scenario
  parameters:
    scenario_name: Pressure-load challenge
    scenario_description: Baseline is followed by a arterial pressure challenge and
      recovery period.
    baseline_until: 150.0
    challenge_until: 450.0
    schedule:
      antidiuretic_hormone_concentration:
        baseline: 1.0
        challenge: 1.0
        recovery: 1.0
        unit: dimensionless
        label: antidiuretic hormone concentration
        description: Scenario-controlled antidiuretic hormone concentration value.
        active: false
      angiotensin_drive:
        baseline: 0.987545
        challenge: 0.987545
        recovery: 0.987545
        unit: dimensionless
        label: angiotensin drive
        description: Scenario-controlled angiotensin drive value.
        active: false
      arterial_pressure:
        baseline: 35.1148
        challenge: 42.13776
        recovery: 35.1148
        unit: dimensionless
        label: arterial pressure
        description: Scenario-controlled arterial pressure value.
        active: true
- alias: guyton1972_thirst_drinking_salt_appetite_core
  path: ./models/core
  parameters:
    model_path: data/MODEL0910846879.xml
    integration_step: 1.0
- alias: guyton1972_thirst_drinking_salt_appetite_viz
  path: ./models/viz
  parameters:
    integration_step: 1.0
    lab_title: Guyton1972 Thirst Drinking Salt Appetite
    lab_question: Does thirst or salt appetite activate?
runtime:
  duration: 600.0
  communication_step: 1.0
  initial_inputs:
    guyton1972_thirst_drinking_salt_appetite_core:
      integration_step: 1.0
      parameter_overrides:
        payload: {}
      initial_conditions:
        payload: {}
io:
  inputs:
  - name: integration_step
    maps_to: guyton1972_thirst_drinking_salt_appetite_core.integration_step
  - name: parameter_overrides
    maps_to: guyton1972_thirst_drinking_salt_appetite_core.parameter_overrides
  - name: initial_conditions
    maps_to: guyton1972_thirst_drinking_salt_appetite_core.initial_conditions
  outputs:
  - name: scenario_metadata
    maps_to: guyton1972_thirst_drinking_salt_appetite_scenario.scenario_metadata
  - name: state
    maps_to: guyton1972_thirst_drinking_salt_appetite_core.state
  - name: run_summary
    maps_to: guyton1972_thirst_drinking_salt_appetite_viz.run_summary
wiring:
- from: guyton1972_thirst_drinking_salt_appetite_scenario.antidiuretic_hormone_concentration
  to:
  - guyton1972_thirst_drinking_salt_appetite_core.antidiuretic_hormone_concentration
- from: guyton1972_thirst_drinking_salt_appetite_scenario.angiotensin_drive
  to:
  - guyton1972_thirst_drinking_salt_appetite_core.angiotensin_drive
- from: guyton1972_thirst_drinking_salt_appetite_scenario.arterial_pressure
  to:
  - guyton1972_thirst_drinking_salt_appetite_core.arterial_pressure
- from: guyton1972_thirst_drinking_salt_appetite_scenario.scenario_metadata
  to:
  - guyton1972_thirst_drinking_salt_appetite_viz.scenario_metadata
- from: guyton1972_thirst_drinking_salt_appetite_core.state
  to:
  - guyton1972_thirst_drinking_salt_appetite_viz.state
- from: guyton1972_thirst_drinking_salt_appetite_core.species_labels
  to:
  - guyton1972_thirst_drinking_salt_appetite_viz.species_labels
