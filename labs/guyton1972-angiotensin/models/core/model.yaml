schema_version: '2.0'
title: Guyton1972_Angiotensin
description: 'This a model from the article: Circulation: overall regulation. It can
  be used to explore cardiac dynamics and compare response patterns across conditions.'
standard: other
tags:
- cardiovascular
- sbml
- biomodels_ebi
- faithful
authors:
- Biosimulant Team
- A C Guyton
- T G Coleman
- H J Granger
upstream:
  id: biomodels_ebi:MODEL0911342562
  source_db: biomodels_ebi
  source_id: MODEL0911342562
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL0911342562
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL0911342562?filename=MODEL0911342562_url.xml
  license: CC0
biosim:
  entrypoint: src.guyton1972_angiotensin_model0911342562_model:Guyton1972AngiotensinModel0911342562Model
  init_kwargs:
    model_path: data/MODEL0911342562.xml
    integration_step: 1.0
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
parameters:
- name: model_path
  value: data/MODEL0911342562.xml
  description: Relative path to the SBML file shipped with this model.
- name: integration_step
  value: 1.0
  min: 0.0
  units: s
  description: ODE solver integration step size in seconds.
io:
  inputs:
  - name: renal_perfusion
    accepted_units:
    - dimensionless
    description: Sets renal perfusion for the simulation scenario. Default `1.00051`.
  - name: sympathetic_drive
    accepted_units:
    - dimensionless
    description: Sets sympathetic drive for the simulation scenario. Default `0.4`.
  - name: angiotensin_infusion
    accepted_units:
    - dimensionless
    description: Sets angiotensin infusion for the simulation scenario. Default `0.0`.
  - name: integration_step
    accepted_units:
    - s
    description: Override the ODE solver integration step. Smaller = more precise
      but slower.
  - name: parameter_overrides
    description: Map of SBML global parameter name to override value, applied before
      each advance_window. Use the parameter list in the lab README for keys not surfaced
      as named ports above.
  - name: initial_conditions
    description: Map of SBML species ID to initial concentration override, applied
      at setup and on reset. Use the species list in the lab README to discover keys.
  outputs:
  - name: state
    description: Species concentrations and state variables read from the SBML model.
      Wired into the lab's `viz` sub-model for timeseries rendering.
  - name: species_labels
    description: Static record mapping each SBML species id to a human-friendly label
      (read from `<species name=...>` or prettified id). Emitted on every window but
      only needed once by downstream presenters.
