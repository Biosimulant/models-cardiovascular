schema_version: '2.0'
title: Chen2006 - Nitric Oxide Release from Endothelial Cells
description: 'Chen2006 - Nitric Oxide Release fromEndothelial Cells This model is
  described in the article: Theoretical analysis of biochemical pathways of nitric
  oxide release from vascular endothelial cells. It can be used to explore cardiac
  dynamics and compare response patterns across conditions.'
standard: other
tags:
- cardiovascular
- sbml
- biomodels_ebi
- faithful
authors:
- Biosimulant Team
- Kejing Chen
- Aleksander S Popel
upstream:
  id: biomodels_ebi:BIOMD0000000676
  source_db: biomodels_ebi
  source_id: BIOMD0000000676
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000676
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000676?filename=BIOMD0000000676_url.xml
  license: CC0
biosim:
  entrypoint: src.chen2006_nitric_oxide_release_from_endothelial_c_biomd0000000676_model:Chen2006NitricOxideReleaseFromEndothelialCBiomd0000000676Model
  init_kwargs:
    model_path: data/BIOMD0000000676.xml
    integration_step: 0.01
  communication_step: 0.01
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
parameters:
- name: model_path
  value: data/BIOMD0000000676.xml
  description: Relative path to the SBML file shipped with this model.
- name: integration_step
  value: 0.01
  min: 0.0
  units: s
  description: ODE solver integration step size in seconds.
io:
  inputs:
  - name: l_arginine
    accepted_units:
    - dimensionless
    description: Sets L-arginine for the simulation scenario. Default `100`.
  - name: oxygen
    accepted_units:
    - dimensionless
    description: Sets oxygen for the simulation scenario. Default `150`.
  - name: nitric_oxide_synthase_pool
    accepted_units:
    - dimensionless
    description: Sets nitric oxide synthase pool for the simulation scenario. Default
      `0.015`.
  - name: arg_binding_rate
    accepted_units:
    - dimensionless
    description: Sets arg binding rate for the simulation scenario. Default `0.1`.
  - name: oxygen_binding_rate
    accepted_units:
    - dimensionless
    description: Sets oxygen binding rate for the simulation scenario. Default `1.89`.
  - name: integration_step
    accepted_units:
    - s
    description: Override the ODE solver integration step. Smaller = more precise
      but slower.
  - name: parameter_overrides
    description: Map of SBML global parameter name to override value, applied before
      each advance_window. Use the parameter list in the lab README for keys not surfaced
      as named ports above.
  - name: initial_conditions
    description: Map of SBML species ID to initial concentration override, applied
      at setup and on reset. Use the species list in the lab README to discover keys.
  outputs:
  - name: state
    description: Species concentrations and state variables read from the SBML model.
      Wired into the lab's `viz` sub-model for timeseries rendering.
  - name: summary
    description: Final, peak, and largest-change summary computed from the simulated SBML state history.
  - name: species_labels
    description: Static record mapping each SBML species id to a human-friendly label
      (read from `<species name=...>` or prettified id). Emitted on every window but
      only needed once by downstream presenters.
