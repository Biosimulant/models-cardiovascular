schema_version: '2.0'
title: Guyton1972 Volume Receptors Lab
description: 'Two-model lab for Guyton1972 Volume Receptors: a core SBML simulator
  wired into a dedicated visualization sub-model that turns the raw state into friendly
  timeseries and a plain-language summary. This a model from the article: Circulation:
  overall regulation. It can be used to explore cardiac dynamics and compare response
  patterns across conditions.'
models:
- alias: guyton1972_volume_receptors_scenario
  path: models/scenario
  parameters:
    scenario_name: Pressure-load challenge
    scenario_description: Baseline is followed by a right atrial pressure challenge
      and recovery period.
    baseline_until: 150.0
    challenge_until: 450.0
    schedule:
      right_atrial_pressure:
        baseline: 0.00852183
        challenge: 0.010226195999999998
        recovery: 0.00852183
        unit: dimensionless
        label: right atrial pressure
        description: Scenario-controlled right atrial pressure value.
        active: true
- alias: guyton1972_volume_receptors_core
  path: ./models/core
  parameters:
    model_path: data/MODEL0909931851.xml
    integration_step: 1.0
- alias: guyton1972_volume_receptors_viz
  path: ./models/viz
  parameters:
    integration_step: 1.0
    lab_title: Guyton1972 Volume Receptors
    lab_question: Do volume receptors detect volume expansion?
runtime:
  duration: 600.0
  communication_step: 1.0
  initial_inputs:
    guyton1972_volume_receptors_core:
      integration_step: 1.0
      parameter_overrides:
        payload: {}
      initial_conditions:
        payload: {}
io:
  inputs:
  - name: integration_step
    maps_to: guyton1972_volume_receptors_core.integration_step
  - name: parameter_overrides
    maps_to: guyton1972_volume_receptors_core.parameter_overrides
  - name: initial_conditions
    maps_to: guyton1972_volume_receptors_core.initial_conditions
  outputs:
  - name: scenario_metadata
    maps_to: guyton1972_volume_receptors_scenario.scenario_metadata
  - name: state
    maps_to: guyton1972_volume_receptors_core.state
  - name: run_summary
    maps_to: guyton1972_volume_receptors_viz.run_summary
wiring:
- from: guyton1972_volume_receptors_scenario.right_atrial_pressure
  to:
  - guyton1972_volume_receptors_core.right_atrial_pressure
- from: guyton1972_volume_receptors_scenario.scenario_metadata
  to:
  - guyton1972_volume_receptors_viz.scenario_metadata
- from: guyton1972_volume_receptors_core.state
  to:
  - guyton1972_volume_receptors_viz.state
- from: guyton1972_volume_receptors_core.species_labels
  to:
  - guyton1972_volume_receptors_viz.species_labels
