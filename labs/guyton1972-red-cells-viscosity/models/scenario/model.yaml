schema_version: '1.0'
title: Guyton1972 Red Cells Viscosity Scenario
description: Scenario driver that emits baseline, challenge, and recovery inputs for
  the cardiovascular core model.
package: cardiovascular-scenario-guyton1972-red-cells-viscosity
version: 0.1.0
standard: other
tags:
- cardiovascular
- scenario
- stimulus
authors:
- name: Biosimulant Team
biosim:
  entrypoint: src.guyton1972_red_cells_viscosity_scenario.CardiovascularScenarioModel
  communication_step: 1.0
runtime:
  dependencies:
    packages: []
parameters:
- name: scenario_name
  value: Cardiovascular control challenge
  description: Plain-language name shown in visualizations.
- name: scenario_description
  value: Baseline is followed by a erythropoiesis drive challenge and recovery period.
  description: Plain-language scenario description shown in visualizations.
- name: baseline_until
  value: 150.0
  units: s
  min: 0.0
  description: Simulation time at which the challenge starts.
- name: challenge_until
  value: 450.0
  units: s
  min: 0.0
  description: Simulation time at which recovery starts.
- name: schedule
  value:
    plasma_volume:
      baseline: 3.00449
      challenge: 3.00449
      recovery: 3.00449
      unit: dimensionless
      label: plasma volume
      description: Scenario-controlled plasma volume value.
      active: false
    erythropoiesis_drive:
      baseline: 150.0
      challenge: 225.0
      recovery: 150.0
      unit: dimensionless
      label: erythropoiesis drive
      description: Scenario-controlled erythropoiesis drive value.
      active: true
  description: Per-output baseline, challenge, and recovery values emitted by the
    scenario driver.
io:
  inputs: []
  outputs:
  - name: plasma_volume
    emitted_unit: dimensionless
    description: Scenario-controlled plasma volume value.
  - name: erythropoiesis_drive
    emitted_unit: dimensionless
    description: Scenario-controlled erythropoiesis drive value.
  - name: scenario_metadata
    description: Scenario name, active input, values, timing, and event markers.
