schema_version: '1.0'
title: Guyton1972 Heart Rate Stroke Volume Scenario
description: Scenario driver that emits baseline, challenge, and recovery inputs for
  the cardiovascular core model.
package: cardiovascular-scenario-guyton1972-heart-rate-stroke-volume
version: 0.1.0
standard: other
tags:
- cardiovascular
- scenario
- stimulus
authors:
- name: Biosimulant Team
biosim:
  entrypoint: src.guyton1972_heart_rate_stroke_volume_scenario.CardiovascularScenarioModel
  communication_step: 0.01
runtime:
  dependencies:
    packages: []
parameters:
- name: scenario_name
  value: Pressure-load challenge
  description: Plain-language name shown in visualizations.
- name: scenario_description
  value: Baseline is followed by a right atrial pressure challenge and recovery period.
  description: Plain-language scenario description shown in visualizations.
- name: baseline_until
  value: 2.5
  units: s
  min: 0.0
  description: Simulation time at which the challenge starts.
- name: challenge_until
  value: 7.5
  units: s
  min: 0.0
  description: Simulation time at which recovery starts.
- name: schedule
  value:
    autonomic_drive:
      baseline: 1.3
      challenge: 1.3
      recovery: 1.3
      unit: dimensionless
      label: autonomic drive
      description: Scenario-controlled autonomic drive value.
      active: false
    right_atrial_pressure:
      baseline: 0.00852183
      challenge: 0.010226195999999998
      recovery: 0.00852183
      unit: dimensionless
      label: right atrial pressure
      description: Scenario-controlled right atrial pressure value.
      active: true
    cardiac_output:
      baseline: 4.9943
      challenge: 4.9943
      recovery: 4.9943
      unit: dimensionless
      label: cardiac output
      description: Scenario-controlled cardiac output value.
      active: false
  description: Per-output baseline, challenge, and recovery values emitted by the
    scenario driver.
io:
  inputs: []
  outputs:
  - name: autonomic_drive
    emitted_unit: dimensionless
    description: Scenario-controlled autonomic drive value.
  - name: right_atrial_pressure
    emitted_unit: dimensionless
    description: Scenario-controlled right atrial pressure value.
  - name: cardiac_output
    emitted_unit: dimensionless
    description: Scenario-controlled cardiac output value.
  - name: scenario_metadata
    description: Scenario name, active input, values, timing, and event markers.
