schema_version: '1.0'
title: Guyton1972 Antidiuretic Hormone Scenario
description: Scenario driver that emits baseline, challenge, and recovery inputs for
  the cardiovascular core model.
package: cardiovascular-scenario-guyton1972-antidiuretic-hormone
version: 0.1.0
standard: other
tags:
- cardiovascular
- scenario
- stimulus
authors:
- name: Biosimulant Team
biosim:
  entrypoint: src.guyton1972_antidiuretic_hormone_scenario.CardiovascularScenarioModel
  communication_step: 1.0
runtime:
  dependencies:
    packages: []
parameters:
- name: scenario_name
  value: Antidiuretic hormone challenge
  description: Plain-language name shown in visualizations.
- name: scenario_description
  value: Baseline is followed by a antidiuretic hormone infusion challenge and recovery
    period.
  description: Plain-language scenario description shown in visualizations.
- name: baseline_until
  value: 150.0
  units: s
  min: 0.0
  description: Simulation time at which the challenge starts.
- name: challenge_until
  value: 450.0
  units: s
  min: 0.0
  description: Simulation time at which recovery starts.
- name: schedule
  value:
    sodium_concentration:
      baseline: 142.035
      challenge: 142.035
      recovery: 142.035
      unit: dimensionless
      label: sodium concentration
      description: Scenario-controlled sodium concentration value.
      active: false
    arterial_pressure:
      baseline: 103.525
      challenge: 103.525
      recovery: 103.525
      unit: dimensionless
      label: arterial pressure
      description: Scenario-controlled arterial pressure value.
      active: false
    antidiuretic_hormone_infusion:
      baseline: 0.0
      challenge: 1.0
      recovery: 0.0
      unit: dimensionless
      label: antidiuretic hormone infusion
      description: Scenario-controlled antidiuretic hormone infusion value.
      active: true
  description: Per-output baseline, challenge, and recovery values emitted by the
    scenario driver.
io:
  inputs: []
  outputs:
  - name: sodium_concentration
    emitted_unit: dimensionless
    description: Scenario-controlled sodium concentration value.
  - name: arterial_pressure
    emitted_unit: dimensionless
    description: Scenario-controlled arterial pressure value.
  - name: antidiuretic_hormone_infusion
    emitted_unit: dimensionless
    description: Scenario-controlled antidiuretic hormone infusion value.
  - name: scenario_metadata
    description: Scenario name, active input, values, timing, and event markers.
