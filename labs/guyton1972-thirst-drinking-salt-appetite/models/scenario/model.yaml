schema_version: '1.0'
title: Guyton1972 Thirst Drinking Salt Appetite Scenario
description: Scenario driver that emits baseline, challenge, and recovery inputs for
  the cardiovascular core model.
package: cardiovascular-scenario-guyton1972-thirst-drinking-salt-appetite
version: 0.1.0
standard: other
tags:
- cardiovascular
- scenario
- stimulus
authors:
- name: Biosimulant Team
biosim:
  entrypoint: src.guyton1972_thirst_drinking_salt_appetite_scenario.CardiovascularScenarioModel
  communication_step: 1.0
runtime:
  dependencies:
    packages: []
parameters:
- name: scenario_name
  value: Pressure-load challenge
  description: Plain-language name shown in visualizations.
- name: scenario_description
  value: Baseline is followed by a arterial pressure challenge and recovery period.
  description: Plain-language scenario description shown in visualizations.
- name: baseline_until
  value: 150.0
  units: s
  min: 0.0
  description: Simulation time at which the challenge starts.
- name: challenge_until
  value: 450.0
  units: s
  min: 0.0
  description: Simulation time at which recovery starts.
- name: schedule
  value:
    antidiuretic_hormone_concentration:
      baseline: 1.0
      challenge: 1.0
      recovery: 1.0
      unit: dimensionless
      label: antidiuretic hormone concentration
      description: Scenario-controlled antidiuretic hormone concentration value.
      active: false
    angiotensin_drive:
      baseline: 0.987545
      challenge: 0.987545
      recovery: 0.987545
      unit: dimensionless
      label: angiotensin drive
      description: Scenario-controlled angiotensin drive value.
      active: false
    arterial_pressure:
      baseline: 35.1148
      challenge: 42.13776
      recovery: 35.1148
      unit: dimensionless
      label: arterial pressure
      description: Scenario-controlled arterial pressure value.
      active: true
  description: Per-output baseline, challenge, and recovery values emitted by the
    scenario driver.
io:
  inputs: []
  outputs:
  - name: antidiuretic_hormone_concentration
    emitted_unit: dimensionless
    description: Scenario-controlled antidiuretic hormone concentration value.
  - name: angiotensin_drive
    emitted_unit: dimensionless
    description: Scenario-controlled angiotensin drive value.
  - name: arterial_pressure
    emitted_unit: dimensionless
    description: Scenario-controlled arterial pressure value.
  - name: scenario_metadata
    description: Scenario name, active input, values, timing, and event markers.
