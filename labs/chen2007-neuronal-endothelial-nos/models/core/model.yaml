schema_version: '2.0'
title: Chen2007_NeuronalEndothelialNOS
description: 'This a model from the article: Vascular and perivascular nitric oxide
  release and transport: biochemical pathways of neuronal nitric oxide synthase (NOS1)
  and endothelial nitric oxide synthase (NOS3). It can be used to explore cardiac
  dynamics and compare response patterns across conditions.'
standard: other
tags:
- cardiovascular
- sbml
- biomodels_ebi
- faithful
authors:
- Biosimulant Team
- Kejing Chen
- Popel AS
upstream:
  id: biomodels_ebi:MODEL0491251823
  source_db: biomodels_ebi
  source_id: MODEL0491251823
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL0491251823
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL0491251823?filename=MODEL0491251823_url.xml
  license: CC0
biosim:
  entrypoint: src.chen2007_neuronalendothelialnos_model0491251823_model:Chen2007NeuronalendothelialnosModel0491251823Model
  init_kwargs:
    model_path: data/MODEL0491251823.xml
    integration_step: 0.001
  communication_step: 0.001
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
parameters:
- name: model_path
  value: data/MODEL0491251823.xml
  description: Relative path to the SBML file shipped with this model.
- name: integration_step
  value: 0.001
  min: 0.0
  units: s
  description: ODE solver integration step size in seconds.
io:
  inputs:
  - name: l_arginine
    accepted_units:
    - dimensionless
    description: Sets L-arginine for the simulation scenario. Default `0.0`.
  - name: oxygen
    accepted_units:
    - dimensionless
    description: Sets oxygen for the simulation scenario. Default `0.0`.
  - name: nitric_oxide_synthase_pool
    accepted_units:
    - dimensionless
    description: Sets nitric oxide synthase pool for the simulation scenario. Default
      `0.3`.
  - name: integration_step
    accepted_units:
    - s
    description: Override the ODE solver integration step. Smaller = more precise
      but slower.
  - name: parameter_overrides
    description: Map of SBML global parameter name to override value, applied before
      each advance_window. Use the parameter list in the lab README for keys not surfaced
      as named ports above.
  - name: initial_conditions
    description: Map of SBML species ID to initial concentration override, applied
      at setup and on reset. Use the species list in the lab README to discover keys.
  outputs:
  - name: state
    description: Species concentrations and state variables read from the SBML model.
      Wired into the lab's `viz` sub-model for timeseries rendering.
  - name: summary
    description: Final, peak, and largest-change summary computed from the simulated SBML state history.
  - name: species_labels
    description: Static record mapping each SBML species id to a human-friendly label
      (read from `<species name=...>` or prettified id). Emitted on every window but
      only needed once by downstream presenters.
