schema_version: '2.0'
package: guyton1972-red-cells-viscosity
version: 1.0.0
title: Guyton1972 Red Cells Viscosity Lab
description: 'Two-model lab for Guyton1972 Red Cells Viscosity: a core SBML simulator
  wired into a dedicated visualization sub-model that turns the raw state into friendly
  timeseries and a plain-language summary. This a model from the article: Circulation:
  overall regulation. It can be used to explore cardiac dynamics and compare response
  patterns across conditions.'
models:
- alias: guyton1972_red_cells_viscosity_scenario
  path: models/scenario
  parameters:
    scenario_name: Cardiovascular control challenge
    scenario_description: Baseline is followed by a erythropoiesis drive challenge
      and recovery period.
    baseline_until: 150.0
    challenge_until: 450.0
    schedule:
      plasma_volume:
        baseline: 3.00449
        challenge: 3.00449
        recovery: 3.00449
        unit: dimensionless
        label: plasma volume
        description: Scenario-controlled plasma volume value.
        active: false
      erythropoiesis_drive:
        baseline: 150.0
        challenge: 225.0
        recovery: 150.0
        unit: dimensionless
        label: erythropoiesis drive
        description: Scenario-controlled erythropoiesis drive value.
        active: true
- alias: guyton1972_red_cells_viscosity_core
  path: ./models/core
  parameters:
    model_path: data/MODEL0910928451.xml
    integration_step: 1.0
- alias: guyton1972_red_cells_viscosity_viz
  path: ./models/viz
  parameters:
    integration_step: 1.0
    lab_title: Guyton1972 Red Cells Viscosity
    lab_question: How do red cells change blood viscosity?
runtime:
  duration: 600.0
  communication_step: 1.0
  initial_inputs:
    guyton1972_red_cells_viscosity_core:
      integration_step: 1.0
      parameter_overrides:
        payload: {}
      initial_conditions:
        payload: {}
io:
  inputs:
  - name: integration_step
    maps_to: guyton1972_red_cells_viscosity_core.integration_step
  - name: parameter_overrides
    maps_to: guyton1972_red_cells_viscosity_core.parameter_overrides
  - name: initial_conditions
    maps_to: guyton1972_red_cells_viscosity_core.initial_conditions
  outputs:
  - name: scenario_metadata
    maps_to: guyton1972_red_cells_viscosity_scenario.scenario_metadata
  - name: state
    maps_to: guyton1972_red_cells_viscosity_core.state
  - name: run_summary
    maps_to: guyton1972_red_cells_viscosity_viz.run_summary
wiring:
- from: guyton1972_red_cells_viscosity_scenario.plasma_volume
  to:
  - guyton1972_red_cells_viscosity_core.plasma_volume
- from: guyton1972_red_cells_viscosity_scenario.erythropoiesis_drive
  to:
  - guyton1972_red_cells_viscosity_core.erythropoiesis_drive
- from: guyton1972_red_cells_viscosity_scenario.scenario_metadata
  to:
  - guyton1972_red_cells_viscosity_viz.scenario_metadata
- from: guyton1972_red_cells_viscosity_core.state
  to:
  - guyton1972_red_cells_viscosity_viz.state
- from: guyton1972_red_cells_viscosity_core.species_labels
  to:
  - guyton1972_red_cells_viscosity_viz.species_labels
