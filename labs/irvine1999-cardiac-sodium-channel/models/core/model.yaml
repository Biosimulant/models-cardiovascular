schema_version: '2.0'
title: Irvine1999_CardiacSodiumChannel
description: 'This a model from the article: Cardiac sodium channel Markov model with
  temperature dependence and recoveryfrom inactivation. It can be used to explore
  cardiac dynamics and compare response patterns across conditions.'
standard: other
tags:
- cardiovascular
- sbml
- biomodels_ebi
- faithful
authors:
- Biosimulant Team
- L A Irvine
- M Saleet Jafri
- R L Winslow
upstream:
  id: biomodels_ebi:MODEL0848062679
  source_db: biomodels_ebi
  source_id: MODEL0848062679
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL0848062679
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL0848062679?filename=MODEL0848062679_url.xml
  license: CC0
biosim:
  entrypoint: src.irvine1999_cardiacsodiumchannel_model0848062679_model:Irvine1999CardiacsodiumchannelModel0848062679Model
  init_kwargs:
    model_path: data/MODEL0848062679.xml
    integration_step: 0.001
  communication_step: 0.001
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
parameters:
- name: model_path
  value: data/MODEL0848062679.xml
  description: Relative path to the SBML file shipped with this model.
- name: integration_step
  value: 0.001
  min: 0.0
  units: s
  description: ODE solver integration step size in seconds.
io:
  inputs:
  - name: holding_voltage
    accepted_units:
    - mV
    description: Sets holding voltage for the simulation scenario. Default `-0.12`.
  - name: sodium_reversal_voltage
    accepted_units:
    - mV
    description: Sets sodium reversal voltage for the simulation scenario. Default
      `0.044675`.
  - name: sodium_conductance
    accepted_units:
    - mS_per_uF
    description: Sets sodium conductance for the simulation scenario. Default `0.0131`.
  - name: integration_step
    accepted_units:
    - s
    description: Override the ODE solver integration step. Smaller = more precise
      but slower.
  - name: parameter_overrides
    description: Map of SBML global parameter name to override value, applied before
      each advance_window. Use the parameter list in the lab README for keys not surfaced
      as named ports above.
  - name: initial_conditions
    description: Map of SBML species ID to initial concentration override, applied
      at setup and on reset. Use the species list in the lab README to discover keys.
  outputs:
  - name: state
    description: Species concentrations and state variables read from the SBML model.
      Wired into the lab's `viz` sub-model for timeseries rendering.
  - name: species_labels
    description: Static record mapping each SBML species id to a human-friendly label
      (read from `<species name=...>` or prettified id). Emitted on every window but
      only needed once by downstream presenters.
