schema_version: '1.0'
title: Guyton1972 Atrial Natriuretic Peptide Scenario
description: Scenario driver that emits baseline, challenge, and recovery inputs for
  the cardiovascular core model.
package: cardiovascular-scenario-guyton1972-atrial-natriuretic-peptide
version: 0.1.0
standard: biosim-module
tags:
- cardiovascular
- scenario
- stimulus
authors:
- name: Biosimulant Team
biosim:
  entrypoint: src.guyton1972_atrial_natriuretic_peptide_scenario.CardiovascularScenarioModel
runtime:
  dependencies:
    packages: []
parameters:
- name: scenario_name
  value: Atrial natriuretic peptide challenge
  description: Plain-language name shown in visualizations.
- name: scenario_description
  value: Baseline is followed by a atrial natriuretic peptide infusion challenge and
    recovery period.
  description: Plain-language scenario description shown in visualizations.
- name: baseline_until
  value: 150.0
  units: s
  min: 0.0
  description: Simulation time at which the challenge starts.
- name: challenge_until
  value: 450.0
  units: s
  min: 0.0
  description: Simulation time at which recovery starts.
- name: schedule
  value:
    left_atrial_pressure:
      baseline: 2.0
      challenge: 2.0
      recovery: 2.0
      unit: dimensionless
      label: left atrial pressure
      description: Scenario-controlled left atrial pressure value.
      active: false
    right_atrial_pressure:
      baseline: 0.00852183
      challenge: 0.00852183
      recovery: 0.00852183
      unit: dimensionless
      label: right atrial pressure
      description: Scenario-controlled right atrial pressure value.
      active: false
    atrial_natriuretic_peptide_infusion:
      baseline: 0.0
      challenge: 1.0
      recovery: 0.0
      unit: dimensionless
      label: atrial natriuretic peptide infusion
      description: Scenario-controlled atrial natriuretic peptide infusion value.
      active: true
  description: Per-output baseline, challenge, and recovery values emitted by the
    scenario driver.
io:
  inputs: []
  outputs:
  - name: left_atrial_pressure
    emitted_unit: dimensionless
    description: Scenario-controlled left atrial pressure value.
  - name: right_atrial_pressure
    emitted_unit: dimensionless
    description: Scenario-controlled right atrial pressure value.
  - name: atrial_natriuretic_peptide_infusion
    emitted_unit: dimensionless
    description: Scenario-controlled atrial natriuretic peptide infusion value.
  - name: scenario_metadata
    description: Scenario name, active input, values, timing, and event markers.
