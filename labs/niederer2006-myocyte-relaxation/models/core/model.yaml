schema_version: '2.0'
title: Niederer2006_CardiacMyocyteRelaxation
description: 'This a model from the article: A quantitative analysis of cardiac myocyte
  relaxation: a simulation study. It can be used to explore cardiac dynamics and compare
  response patterns across conditions.'
standard: other
tags:
- cardiovascular
- sbml
- biomodels_ebi
- faithful
authors:
- Biosimulant Team
- S A Niederer
- P J Hunter
- N P Smith
upstream:
  id: biomodels_ebi:MODEL8687196544
  source_db: biomodels_ebi
  source_id: MODEL8687196544
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL8687196544
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL8687196544?filename=MODEL8687196544_url.xml
  license: CC0
biosim:
  entrypoint: src.niederer2006_cardiacmyocyterelaxation_model8687196544_model:Niederer2006CardiacmyocyterelaxationModel8687196544Model
  init_kwargs:
    model_path: data/MODEL8687196544.xml
    integration_step: 0.001
  communication_step: 0.001
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
parameters:
- name: model_path
  value: data/MODEL8687196544.xml
  description: Relative path to the SBML file shipped with this model.
- name: integration_step
  value: 0.001
  min: 0.0
  units: s
  description: ODE solver integration step size in seconds.
io:
  inputs:
  - name: troponin_pool
    accepted_units:
    - dimensionless
    description: Sets troponin pool for the simulation scenario. Default `0.067593139865`.
  - name: relaxation_rate
    accepted_units:
    - dimensionless
    description: Sets relaxation rate for the simulation scenario. Default `0.002`.
  - name: cooperativity
    accepted_units:
    - dimensionless
    description: Sets cooperativity for the simulation scenario. Default `0.008`.
  - name: integration_step
    accepted_units:
    - s
    description: Override the ODE solver integration step. Smaller = more precise
      but slower.
  - name: parameter_overrides
    description: Map of SBML global parameter name to override value, applied before
      each advance_window. Use the parameter list in the lab README for keys not surfaced
      as named ports above.
  - name: initial_conditions
    description: Map of SBML species ID to initial concentration override, applied
      at setup and on reset. Use the species list in the lab README to discover keys.
  outputs:
  - name: state
    description: Species concentrations and state variables read from the SBML model.
      Wired into the lab's `viz` sub-model for timeseries rendering.
  - name: summary
    description: Final, peak, and largest-change summary computed from the simulated SBML state history.
  - name: species_labels
    description: Static record mapping each SBML species id to a human-friendly label
      (read from `<species name=...>` or prettified id). Emitted on every window but
      only needed once by downstream presenters.
